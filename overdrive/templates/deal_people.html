{% for c in contacts %}<div class="contact-row"><span class="avatar">{{c.name[:1]}}</span><div><a href="/records/{{c.id}}"><strong>{{c.name}}</strong></a><small>{{c.email}}</small><small>{{c.phone}}</small></div><form action="/deals/{{record.id}}/links" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="contact" value="{{c.id}}"><input type="hidden" name="remove" value="true"><button class="icon-button" title="Unlink" aria-label="Unlink {{c.name}}">×</button></form></div>{% endfor %}<a class="text-link" href="/new/contact?deal={{record.id}}">＋ New contact</a><a class="text-link" href="/deals/{{record.id}}/link">Link existing</a>
