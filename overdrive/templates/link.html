{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><h1>Link contact</h1><p>{{record.title}}</p></div></div><form class="panel record-form" method="post" action="/deals/{{record.id}}/links"><input type="hidden" name="csrf" value="{{csrf}}"><label for="contact">Existing contact</label><select id="contact" name="contact" required>{% for c in contacts %}<option value="{{c.id}}">{{c.name}} · {{c.email}}</option>{% endfor %}</select><div class="form-actions"><a class="button" href="/deals/{{record.id}}">Cancel</a><button class="button primary">Link</button></div></form>{% endblock %}
