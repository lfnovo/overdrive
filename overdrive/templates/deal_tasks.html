{% for t in tasks|sort(attribute='done') %}<div class="side-task"><form action="/tasks/{{t.id}}/toggle" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="key" value="{{key}}-{{t.id}}"><input type="hidden" name="version" value="{{t.version}}"><input type="hidden" name="done" value="{{'false' if t.done else 'true'}}"><input type="hidden" name="return" value="/deals/{{record.id}}"><button class="checkbox {% if t.done %}checked{% endif %}" aria-label="{{'Reopen' if t.done else 'Complete'}} {{t.title}}">{{'✓' if t.done else ''}}</button></form><div><a href="/edit/{{t.id}}" class="{% if t.done %}completed{% endif %}">{{t.title}}</a><small class="{% if t.due and t.due<today and not t.done %}late{% endif %}">{{t.due|shortdate}} · {{people_names.get(t.owner,'Team')}}</small></div></div>{% endfor %}<a class="text-link" href="/new/task?deal={{record.id}}">＋ Add task</a>
