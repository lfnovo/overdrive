<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{record.title}}</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/pitlane.css"></head><body class="pitlane preview-document"><header><strong>{{record.title}}</strong><a class="button small" href="/files/{{record.id}}">Download</a></header>{% if pdf %}<iframe class="pdf-document" src="/files/{{record.id}}?inline=true" title="{{record.title}}"></iframe>{% else %}<main class="prose markdown-document">{{content|md|safe}}</main>{% endif %}</body></html>
