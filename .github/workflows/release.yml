name: Release image
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set image tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH[-prerelease]')
          tags = ['ghcr.io/lfnovo/overdrive:' + tag[1:]]
          if os.environ['PRERELEASE'] == 'false':
              latest = subprocess.check_output(['gh', 'api', 'repos/lfnovo/overdrive/releases/latest', '--jq', '.tag_name'], text=True).strip()
              if latest == tag:
                  tags.append('ghcr.io/lfnovo/overdrive:latest')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('images=' + ','.join(tags) + '\n')
          PY
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.images }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
