[project]
name = "overdrive"
version = "0.1.0"
description = "A self-hosted CRM for humans and AI agents"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.35",
  "surrealdb==2.0.0",
  "mcp==1.30.0",
  "authlib>=1.8,<2",
  "httpx>=0.28",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2",
  "itsdangerous>=2",
  "markdown-it-py>=4",
  "nh3>=0.3",
  "surreal-basics==0.8.1",
  "argon2-cffi>=25.1,<26",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "asgi-lifespan>=2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
